name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git Safe Directory
        shell: cmd
        run: git config --global --add safe.directory "*"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install dependencies
        shell: cmd
        run: go mod tidy

      - name: Build
        shell: cmd
        run: go build -buildvcs=false -o app.exe ./cmd/api

      - name: Stop service
        continue-on-error: true
        shell: cmd
        run: net stop PrintingShopAPI

      - name: Wait for service shutdown
        shell: powershell
        run: timeout /t 3

      - name: Copy binary
        shell: cmd
        run: copy /Y app.exe D:\Tools\Apps\printing-shop\app.exe

      - name: Start service
        shell: cmd
        run: net start PrintingShopAPI